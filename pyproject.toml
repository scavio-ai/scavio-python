classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28",
    "httpx>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://scavio.dev"
Documentation = "https://docs.scavio.dev"
Repository = "https://github.com/scavio-ai/scavio-python"
Issues = "https://github.com/scavio-ai/scavio-python/issues"
Changelog = "https://github.com/scavio-ai/scavio-python/releases"
Dashboard = "https://dashboard.scavio.dev"

[tool.hatch.build.targets.wheel]
packages = ["scavio"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Generated code and data-heavy modules carry long literal/doc lines by design.
"scavio/_spec.py" = ["E501"]
"scavio/_namespaces_sync.py" = ["E501"]
"scavio/_namespaces_async.py" = ["E501"]
"tests/_endpoint_cases.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
